[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magisk-boot-patcher"
version = "0.1.0"
description = "Patch Android ROM boot images with Magisk"
requires-python = ">=3.11"
dependencies = ["brotli"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
magisk-boot-patcher = "magisk_boot_patcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needing network access",
    "reference: test needing a real ROM (set MBP_REFERENCE_ROM)",
]
